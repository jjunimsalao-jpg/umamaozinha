<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457e6">
<title>Uma Mãozinha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3f6fb;--ink:#14213d;--mut:#64748b;--pri:#2457e6;--pri2:#1a3fb0;--acc:#ff8a1f;--line:#e2e8f0;--wa:#1faa59;--red:#e03131}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:40px}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
header.top{background:linear-gradient(135deg,#2457e6,#5b3fd6);color:#fff;padding:22px 0 28px;border-radius:0 0 26px 26px}
header.top h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
header.top p{opacity:.9;font-size:14px;margin-top:4px}
.search{margin-top:14px;position:relative}
.search input{width:100%;padding:14px 16px;border:0;border-radius:14px;font-size:16px;outline:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;border:0;padding:9px 4px;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-weight:800;font-size:13px;line-height:1.25;cursor:pointer}
.seg button span{display:block;font-size:20px}
.seg button.on{background:#fff;color:var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 14px 6px;max-width:1000px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip small{opacity:.6;margin-left:4px}
.gtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px;max-width:1000px;margin:0 auto}
.gt{background:#fff;border-radius:18px;padding:20px 10px;text-align:center;box-shadow:0 2px 10px rgba(20,33,61,.08);cursor:pointer;border:1.5px solid var(--line)}
.gt .ic{font-size:38px;line-height:1.1}
.gt b{display:block;font-size:17px;margin-top:6px;line-height:1.2}
.gt small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.gt.cat{padding:24px 10px}
.gt.cat b{font-size:18px;margin-top:0}
.crumb{display:flex;align-items:center;gap:10px;padding:14px 14px 0;max-width:1000px;margin:0 auto;font-weight:800;font-size:16px}
.verTodos{text-align:center;padding:0 14px 14px}
.sub-seg{display:flex;gap:6px;margin:8px 0 4px}
.sub-seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:700;font-size:13px;cursor:pointer;line-height:1.25}
.sub-seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.gbox{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-top:12px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.emo{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.emo span{font-size:24px;cursor:pointer;padding:4px 6px;border-radius:10px;background:#f3f6fb}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:10px 14px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(20,33,61,.08);cursor:pointer;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1/1;background:#dfe7f5;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#8aa0d6}
.tag{position:absolute;top:8px;left:8px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px}
.price{position:absolute;left:8px;bottom:8px;background:rgba(20,33,61,.88);color:#fff;font-size:14px;font-weight:800;padding:6px 11px;border-radius:10px}
.cb{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cb b{font-size:15px;line-height:1.2}
.cb small{color:var(--mut);font-size:12.5px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.wa{background:var(--wa)}
.btn.out{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.gray{background:#e8edf5;color:var(--ink)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.cb .btn{margin-top:auto;padding:10px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:15px}
footer{text-align:center;margin-top:26px;color:var(--mut);font-size:13px}
footer a{color:var(--mut);cursor:pointer;text-decoration:underline}
#modal{position:fixed;inset:0;background:rgba(10,18,40,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:620px;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px 26px;position:relative}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:24px}}
.x{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:20px;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.big{width:calc(100% + 32px);margin:-18px -16px 14px;aspect-ratio:1/1;max-height:70vh;background:#dfe7f5;overflow:hidden;border-radius:24px 24px 0 0}
.big img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.sheet h2{font-size:22px}
.sub{color:var(--mut);font-size:14px;margin:4px 0 10px}
.bigprice{font-size:26px;font-weight:800;color:var(--pri);margin:6px 0}
.note{background:#f3f6fb;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.desc{font-size:15px;line-height:1.5;margin:10px 0 14px;white-space:pre-wrap}
.gal{display:flex;gap:8px;overflow-x:auto;margin:6px 0 16px;padding-bottom:4px}
.gal img{height:130px;width:auto;border-radius:12px;flex:none;cursor:zoom-in}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;z-index:120;display:none}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:#334155}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;font-size:14px}
.chk input{width:20px;height:20px}
.chk label{margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri)}
.box{background:#fff;border-radius:16px;padding:14px;margin:12px 14px;box-shadow:0 2px 10px rgba(20,33,61,.06)}
.box h3{font-size:16px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(20,33,61,.06)}
.stat span{font-size:12px;color:var(--mut);font-weight:700}
.stat b{display:block;font-size:21px;margin-top:4px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it img,.it .ini{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;font-size:24px;background:#dfe7f5}
.it .inf{flex:1;min-width:0}
.it .inf b{display:block;font-size:15px}
.it .inf small{color:var(--mut);font-size:12.5px}
.it .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.g{background:#dcf5e5;color:#157a3b}.pill.y{background:#fff0d6;color:#a35a00}.pill.r{background:#fde2e2;color:#b02222}.pill.b{background:#e3ebff;color:#1a3fb0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:12px}
.scroll{overflow-x:auto}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pv .p{position:relative;width:82px;height:82px}
.pv img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pv .p button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:800;cursor:pointer}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.login{max-width:380px;margin:30px auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 2px 14px rgba(20,33,61,.1)}
.cli{padding:12px 0;border-bottom:1px solid var(--line)}
.cli:last-child{border:0}
.cli .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cli .alvo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;background:#f3f6fb;border-radius:12px;padding:8px 10px;font-size:13.5px}
.cli .alvo span{flex:1;min-width:140px}
.sec{font-size:13px;font-weight:800;color:var(--mut);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt=""></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO DO FIREBASE (já preenchida)
   ============================================================ */
const CONFIG = {
  apiKey: "AIzaSyBx9FMUzfJZw0GYtxCRHRN8fa0fMiscwZE",
  authDomain: "umamaozinha.firebaseapp.com",
  projectId: "umamaozinha",
  appId: "1:957177087598:web:adf1ce11203d4d6385887f"
};
const NOME_APP = "Uma Mãozinha";
const SUBTITULO = "Profissionais, lojas, classificados e vagas da cidade, direto no WhatsApp";
const ADMIN_EMAIL = "admin@umamaozinha.com"; /* e-mail fixo e escondido; você só digita a senha */
const VERSAO = "2.2";
/* ============================================================ */

firebase.initializeApp(CONFIG);
const db = firebase.firestore();
const auth = firebase.auth();

let cats = [], grupos = [], profs = [], ads = [], lancs = [], contatos = [], contatosRec = [], clientesDb = {}, cfg = {}, user = null;
let S = { view: 'pub', sec: 'prof', g: '', cat: '', confSec: 'prof', q: '', tab: 'resumo', mes: mesAtual(), filtro: 'todos', fcli: 'todos' };
let ordem = {}, fotosCache = {}, F = {}, CLI = {}, x_alvos = null;
let unsubs = [];

const CFG_PAD = {
  taxaEntrada: 0, pct: '', mensal: '', prazoDias: 30,
  msgCliente: 'Olá {cliente}! Aqui é do Uma Mãozinha. Você entrou em contato com {profissional} pelo nosso app e queremos saber como foi. Deu tudo certo? Você fechou o serviço? Pode dar uma nota de 1 a 5? Obrigado!',
  msgProf: 'Olá {profissional}! Aqui é do Uma Mãozinha. O cliente {cliente} entrou em contato com você pelo nosso app. Vocês fecharam o serviço?',
  msgRelatorio: 'Olá {profissional}! Seu resumo de {mes} no Uma Mãozinha: {contatos} pessoas chamaram você no WhatsApp pelo app. Continue assim!',
  msgCobranca: 'Olá {profissional}! Passando para lembrar da mensalidade do Uma Mãozinha: {valor}, com vencimento em {vencimento}. Qualquer dúvida é só falar. Obrigado!'
};
const SUG = {
  prof: [
    ['🏗️', 'Construção e reforma', ['Pedreiro', 'Servente', 'Pintor', 'Eletricista', 'Encanador', 'Serralheiro', 'Marceneiro', 'Gesseiro', 'Azulejista e pisos', 'Telhadista']],
    ['🏡', 'Casa e manutenção', ['Diarista', 'Jardineiro', 'Chaveiro', 'Ar-condicionado', 'Dedetização', 'Montador de móveis', 'Técnico de eletrodomésticos']],
    ['🚘', 'Automotivo', ['Mecânico', 'Auto elétrica', 'Funilaria e pintura', 'Borracharia', 'Lava-jato', 'Auto peças']],
    ['💇', 'Beleza', ['Barbeiro', 'Cabeleireira', 'Manicure', 'Maquiadora', 'Esteticista']],
    ['🩺', 'Saúde e bem-estar', ['Dentista', 'Fisioterapeuta', 'Psicólogo', 'Veterinário', 'Farmácia', 'Personal trainer']],
    ['🍽️', 'Alimentação', ['Restaurante', 'Marmitaria', 'Lanchonete', 'Pizzaria', 'Padaria', 'Doceria e bolos', 'Açougue', 'Hortifruti']],
    ['🎉', 'Festas e eventos', ['Buffet', 'DJ e som', 'Fotógrafo', 'Decoração de festa', 'Aluguel de brinquedos']],
    ['💻', 'Tecnologia', ['Técnico de celular', 'Técnico de computador', 'Gráfica e impressão', 'Designer']],
    ['🚚', 'Transporte', ['Frete e carreto', 'Mudanças', 'Moto-táxi', 'Van escolar']],
    ['🌾', 'Rural', ['Veterinário rural', 'Serviço de trator', 'Agropecuária']],
    ['🏪', 'Comércio e lojas', ['Material de construção', 'Loja de roupas', 'Variedades', 'Mercadinho']]
  ],
  class: [
    ['🚗', 'Veículos', ['Carros', 'Motos', 'Bicicletas', 'Elétricos', 'Caminhonetes e caminhões', 'Peças e acessórios']],
    ['🏠', 'Imóveis', ['Casas à venda', 'Apartamentos', 'Terrenos e lotes', 'Chácaras e sítios', 'Aluguel de imóveis', 'Ponto comercial']],
    ['🛋️', 'Casa e móveis', ['Móveis', 'Eletrodomésticos', 'Materiais de construção']],
    ['📱', 'Eletrônicos', ['Celulares', 'Computadores', 'TVs e som']],
    ['🐎', 'Rural e animais', ['Cavalos', 'Gado', 'Cachorros e outros animais', 'Máquinas rurais']],
    ['🔧', 'Ferramentas e máquinas', ['Ferramentas', 'Máquinas e equipamentos']],
    ['👕', 'Outros itens', ['Roupas e calçados', 'Brinquedos e bebê', 'Instrumentos musicais', 'Esporte e academia', 'Doações']]
  ],
  emp: [
    ['💼', 'Empregos', ['Preciso de funcionário', 'Preciso de emprego']]
  ]
};
const EMOJIS = ['🚗', '🏠', '🛋️', '📱', '🐎', '🔧', '🏗️', '🏡', '🚘', '💇', '🩺', '🍽️', '🎉', '💻', '🚚', '🌾', '🏪', '💼', '👕', '🐶', '📦', '⚡', '🎓', '🛒'];

/* ---------- utilidades ---------- */
function mesAtual() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function rangeMes(m) { const [y, mo] = m.split('-').map(Number); return [new Date(y, mo - 1, 1).getTime(), new Date(y, mo, 1).getTime()]; }
function mesLabel(m) { const [y, mo] = m.split('-'); const n = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; return n[mo - 1] + ' de ' + y; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function brl(n) { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function num(v) { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
function dig(s) { return String(s || '').replace(/\D/g, ''); }
function telLimpo(t) { let d = dig(t); if (d.length <= 11) d = '55' + d; return d; }
function $(id) { return document.getElementById(id); }
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2400); }
function grupo(c) { return c.grupo || 'prof'; }
function grupoDe(c) { return c && c.grupoId ? grupos.find(g => g.id === c.grupoId) || null : null; }
function secDe(c) { if (!c) return 'class'; const g = grupoDe(c); return g ? g.sec : grupo(c); }
function isEmp(a) { return secDe(cats.find(c => c.id === a.catId)) === 'emp'; }
function catNome(id) { const c = cats.find(c => c.id === id); return c ? c.nome : ''; }
function catPath(id) { const c = cats.find(c => c.id === id); if (!c) return ''; const g = grupoDe(c); return g ? g.nome + ' › ' + c.nome : c.nome; }
function cfgv(k) { return cfg[k] != null && cfg[k] !== '' ? cfg[k] : CFG_PAD[k]; }
function ef(p, campo) {
  if (p[campo] != null && p[campo] !== '') return Number(p[campo]);
  const c = cats.find(c => c.id === p.catId);
  if (c && c[campo] != null && c[campo] !== '') return Number(c[campo]);
  const g = cfgv(campo); return g !== '' && g != null ? Number(g) : 0;
}
function fill(t, v) { return String(t).replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m); }
function abrirWa(tel, msg) { window.open('https://wa.me/' + telLimpo(tel) + '?text=' + encodeURIComponent(msg), '_blank'); }
function abrirModal(h) { $('modal').innerHTML = '<div class="sheet">' + h + '</div>'; $('modal').classList.add('on'); }
function fechar() { $('modal').classList.remove('on'); $('modal').innerHTML = ''; }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') fechar(); });
function verFoto(src) { $('lbimg').src = src; $('lb').classList.add('on'); }
function precoTxt(a) { if (a.aCombinar || a.preco == null) return isEmp(a) ? 'Salário a combinar' : 'Valor a combinar'; return brl(a.preco); }
function dias(ts) { const d = Math.floor((Date.now() - ts) / 86400000); return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : 'há ' + d + ' dias'; }
function dataBr(ts) { const d = new Date(ts); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function cidadesDl() {
  const s = new Set(['Paraopeba']);
  profs.concat(ads).forEach(x => { if (x.cidade) s.add(x.cidade); });
  return '<datalist id="dlCid">' + Array.from(s).map(c => `<option value="${esc(c)}">`).join('') + '</datalist>';
}
function getCli() { try { const c = JSON.parse(localStorage.getItem('umcli') || 'null'); return c && c.nome && c.tel ? c : null; } catch (e) { return null; } }
function setCli(c) { try { localStorage.setItem('umcli', JSON.stringify(c)); } catch (e) { } }

/* ---------- datas e situação da cobrança ---------- */
function iniDia(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function addDias(ts, n) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d.getTime(); }
function addMes(ts, dia) { const d = new Date(ts); d.setHours(0, 0, 0, 0); const alvo = dia || d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(alvo, ult)); return d.getTime(); }
function dataLonga(ts) { const d = new Date(ts); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }
function stCobr(p) {
  if (!p.cobrancaInicio) {
    const n = p.criadoEm ? Math.floor((iniDia(Date.now()) - iniDia(p.criadoEm)) / 86400000) : null;
    const lim = Number(cfgv('prazoDias')) || 30;
    return { k: 'teste', txt: n == null ? 'Em teste grátis' : 'Em teste há ' + n + (n === 1 ? ' dia' : ' dias'), cls: (n != null && n >= lim) ? 'y' : 'b', dias: n };
  }
  if (!p.venceEm) return { k: 'quite', txt: 'Pago (sem vencimento)', cls: 'g', dias: null };
  const d = Math.round((iniDia(p.venceEm) - iniDia(Date.now())) / 86400000);
  if (d < 0) return { k: 'vencido', txt: 'Vencido há ' + (-d) + (d === -1 ? ' dia' : ' dias'), cls: 'r', dias: d };
  if (d === 0) return { k: 'vence', txt: 'Vence hoje', cls: 'y', dias: d };
  if (d <= 3) return { k: 'vence', txt: 'Vence em ' + d + (d === 1 ? ' dia' : ' dias'), cls: 'y', dias: d };
  return { k: 'emdia', txt: 'Em dia até ' + dataBr(p.venceEm), cls: 'g', dias: d };
}

function comprimir(file, max, q, limite) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const i = new Image();
      i.onload = () => {
        const s = Math.min(1, max / Math.max(i.width, i.height));
        const w = Math.round(i.width * s), h = Math.round(i.height * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
        x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(i, 0, 0, w, h);
        let qq = q, out = c.toDataURL('image/jpeg', qq);
        while (out.length > limite && qq > 0.5) { qq -= 0.05; out = c.toDataURL('image/jpeg', qq); }
        res(out);
      };
      i.onerror = rej; i.src = e.target.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function itensSec(sec) {

function catsDoGrupo(sec, gid) { return cats.filter(c => secDe(c) === sec && (gid === '_outros' ? !grupoDe(c) : c.grupoId === gid)); }
function gruposVisiveis(sec, itens) {
  const L = grupos.filter(g => g.sec === sec).map(g => ({ id: g.id, nome: g.nome, icone: g.icone || '📁' }));
  L.push({ id: '_outros', nome: 'Outros', icone: '📦' });

}
function cardsHtml(lista) {
  if (!lista.length) return '<div class="empty">' + (S.sec === 'emp' ? 'Nada por aqui ainda.<br>Volte em breve, novas vagas aparecem toda hora!' : 'Nada encontrado por aqui ainda.<br>Tente outra busca ou categoria.') + '</div>';

function listar() {
  const el = $('lista'); if (!el) return;
  const q = norm(S.q), itens = itensSec(S.sec);
  const crumb = txt => `<div class="crumb"><button class="btn gray sm" onclick="voltar()">← Voltar</button><span>${esc(txt)}</span></div>`;
  const ordena = l => S.sec === 'prof' ? l.slice().sort((a, b) => (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0) || (ordem[a.id] || 0) - (ordem[b.id] || 0)) : l;
  const qtd = n => S.sec === 'prof' ? n + (n === 1 ? ' profissional' : ' profissionais') : n + (n === 1 ? ' anúncio' : ' anúncios');
  /* busca: procura em tudo da seção */
  if (q) { el.innerHTML = cardsHtml(ordena(itens.filter(x => norm([x.nome || x.titulo, catPath(x.catId), x.bairro, x.cidade, x.desc].join(' ')).includes(q)))); return; }
  /* nível 3: lista de uma categoria */
  if (S.cat) {
    const c = cats.find(x => x.id === S.cat);
    if (!c) { S.cat = ''; return listar(); }
    const g = grupoDe(c);
    el.innerHTML = crumb((g ? g.nome + ' › ' : '') + c.nome) + cardsHtml(ordena(itens.filter(x => x.catId === c.id))); return;
  }
  /* todos */
  if (S.g === '*') { el.innerHTML = crumb('Todos') + cardsHtml(ordena(itens)); return; }
  const gv = gruposVisiveis(S.sec, itens);
  if (!itens.length) { el.innerHTML = cardsHtml([]); return; }
  const auto = !S.g && gv.length === 1 && (gv[0].id === '_outros' || S.sec === 'emp');   /* sem grupos de verdade (ou Empregos, que tem um só): pula direto para as categorias */
  const gid = S.g || (auto ? gv[0].id : '');
  /* nível 2: categorias do grupo */
  if (gid) {
    const g = gv.find(x => x.id === gid);
    if (!g) { S.g = ''; return listar(); }
    const tiles = g.ids.map(id => cats.find(c => c.id === id)).filter(Boolean).map(c => ({ c, n: itens.filter(i => i.catId === c.id).length })).filter(t => t.n > 0);
    el.innerHTML = (auto ? '' : crumb(g.nome)) + '<div class="gtiles">' + tiles.map(t => `<div class="gt cat" onclick="setCat('${t.c.id}')"><b>${esc(t.c.nome)}</b><small>${qtd(t.n)}</small></div>`).join('') + '</div>';
    return;
  }
  /* nível 1: grupos */
  el.innerHTML = '<div class="gtiles">' + gv.map(g => `<div class="gt" onclick="setGrupo('${g.id}')"><div class="ic">${esc(g.icone)}</div><b>${esc(g.nome)}</b><small>${qtd(g.n)}</small></div>`).join('') + '</div>' +
    `<div class="verTodos"><button class="btn out sm" onclick="S.g='*';listar();window.scrollTo(0,0)">Ver todos (${itens.length})</button></div>`;
}

}

    <div><label>Comissão (R$)</label><input id="sc" inputmode="decimal"></div></div>
    <p class="hint">A comissão se calcula sozinha, mas você pode digitar um valor fixo direto no campo da comissão (ex: 800).</p>
    <label>Observação (opcional)</label><input id="so" value="${esc(obsPre || '')}" placeholder="Ex: Casa do Sr. João">
    <button class="btn full" style="margin-top:16px" onclick="salvarServ()">Registrar</button>`);
  preencheServ();
}
function preencheServ() { const p = profs.find(x => x.id === $('sp').value); $('spc').value = p ? (ef(p, 'pct') || '') : ''; calcServ(); }
function calcServ() { const v = num($('sv').value), pc = num($('spc').value); $('sc').value = (v != null && pc != null) ? (Math.round(v * pc) / 100).toFixed(2) : ''; }
async function salvarServ() {
  const p = profs.find(x => x.id === $('sp').value), vs = num($('sv').value), val = num($('sc').value);
  if (!vs || !val) return alert('Preencha o valor do serviço e a comissão.');
  try {
    await db.collection('lancamentos').add({ tipo: 'comissao', profId: p.id, profNome: p.nome, valorServico: vs, pct: num($('spc').value), valor: val, mes: S.mes, pago: false, obs: $('so').value.trim(), ts: Date.now() });
    fechar(); toast('Registrado!');
  } catch (e) { alert('Erro: ' + e.message); }
}
async function gerarMensalidades() {
  let n = 0;
  for (const p of profs.filter(p => p.ativo !== false)) {
    const m = ef(p, 'mensal');
    if (m > 0 && !lancs.some(l => l.tipo === 'mensalidade' && l.profId === p.id)) {
      await db.collection('lancamentos').add({ tipo: 'mensalidade', profId: p.id, profNome: p.nome, valor: m, mes: S.mes, pago: false, obs: '', ts: Date.now() }); n++;
    }
  }
  toast(n ? n + ' mensalidade(s) criada(s)' : 'Nenhuma mensalidade nova');
}
async function pagar(id, v) { await db.collection('lancamentos').doc(id).update({ pago: v, pagoEm: v ? Date.now() : null }); }
async function delLanc(id) { if (confirm('Excluir este lançamento?')) await db.collection('lancamentos').doc(id).delete(); }
function cobrar(id) {
  const l = lancs.find(x => x.id === id), p = l && profs.find(x => x.id === l.profId); if (!p) return;
  const nome = l.tipo === 'mensalidade' ? 'mensalidade' : l.tipo === 'entrada' ? 'taxa de entrada' : 'comissão';
  abrirWa(p.tel, 'Olá ' + p.nome + '! Passando para lembrar da ' + nome + ' do ' + NOME_APP + ' referente a ' + mesLabel(l.mes) + ': ' + brl(l.valor) + '. Obrigado!');
}

/* ---------- Cobrança mensal por profissional ---------- */
function listaPagar() {
  const L = profs.filter(p => p.cobrancaInicio && p.venceEm).sort((a, b) => a.venceEm - b.venceEm);
  const nv = L.filter(p => stCobr(p).k === 'vencido').length;
  return `<div class="box"><h3>Quem precisa pagar (${L.length})</h3>
    ${nv ? `<p class="hint" style="color:var(--red);font-weight:700">${nv} vencido(s)</p>` : ''}
    ${L.map(p => { const s = stCobr(p); return `<div class="it"><div class="inf"><b>${esc(p.nome)}</b><small>${esc(catNome(p.catId))} • vence em ${dataLonga(p.venceEm)}</small><br>
      <b style="font-size:16px">${brl(p.valorCobranca)}</b> <span class="pill ${s.cls}">${s.txt}</span></div>
      <div class="ac"><button class="btn sm" onclick="pagouMensal('${p.id}')">✔ Pago</button><button class="btn wa sm" onclick="cobrarVenc('${p.id}')">Cobrar</button></div></div>`; }).join('') || '<div class="empty">Ninguém com cobrança ativa ainda.<br>Quando o teste de alguém acabar, toque em Iniciar cobrança.</div>'}</div>`;
}
function listaTeste() {
  const L = profs.filter(p => p.ativo !== false && !p.cobrancaInicio).sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
  return `<div class="box"><h3>Em teste grátis (${L.length})</h3>
    ${L.map(p => { const s = stCobr(p); return `<div class="it"><div class="inf"><b>${esc(p.nome)}</b><small>${esc(catNome(p.catId))} • cadastrado em ${p.criadoEm ? dataLonga(p.criadoEm) : '—'}</small><br>
      <span class="pill ${s.cls}">${s.txt}</span></div>
      <div class="ac"><button class="btn out sm" onclick="iniciarCobranca('${p.id}')">Iniciar cobrança</button></div></div>`; }).join('') || '<div class="empty">Ninguém em teste grátis.</div>'}</div>`;
}
function iniciarCobranca(id) {
  const p = profs.find(x => x.id === id); if (!p) return;
  const sug = ef(p, 'mensal') || Number(cfgv('taxaEntrada') || 0);
  abrirModal(`<button class="x" onclick="fechar()">×</button><h2>Iniciar cobrança</h2>
    <p class="sub">${esc(p.nome)} • cadastrado em ${p.criadoEm ? dataLonga(p.criadoEm) : '—'}</p>
    <label>Valor a cobrar (R$)</label><input id="icv" inputmode="decimal" value="${sug || ''}" placeholder="Ex: 50">
    <label>Prazo para pagar (dias)</label><input id="icp" inputmode="numeric" value="${Number(cfgv('prazoDias')) || 30}">
    <div class="chk"><input type="checkbox" id="icr" checked><label>Cobrar todo mês (desmarque se for pagamento único)</label></div>
    <p class="hint">A partir de hoje ele tem esse prazo para pagar. Passado o prazo, aparece como vencido na aba Cobranças.</p>
    <button class="btn full" style="margin-top:16px" onclick="confirmarInicio('${id}')">Iniciar cobrança</button>`);
}
async function confirmarInicio(id) {
  const v = num($('icv').value), pz = parseInt($('icp').value, 10);
  if (!v || v <= 0) return alert('Digite o valor a cobrar.');
  if (isNaN(pz) || pz < 0) return alert('Digite o prazo em dias.');
  const agora = Date.now(), venc = addDias(agora, pz);
  try {
    await db.collection('profissionais').doc(id).set({ cobrancaInicio: agora, venceEm: venc, diaVenc: new Date(venc).getDate(), valorCobranca: v, recorrente: $('icr').checked }, { merge: true });
    fechar(); toast('Cobrança iniciada. Vence em ' + dataLonga(venc));
  } catch (e) { alert('Erro: ' + e.message); }
}
function voltarTeste(id) {
  if (!confirm('Voltar este profissional para o teste grátis? O vencimento será apagado.')) return;
  db.collection('profissionais').doc(id).set({ cobrancaInicio: null, venceEm: null, valorCobranca: null }, { merge: true });
  toast('Voltou para o teste grátis');
}
async function pagouMensal(id) {
  const p = profs.find(x => x.id === id); if (!p || !p.venceEm) return;
  const v = Number(p.valorCobranca || 0);
  if (!confirm('Registrar o pagamento de ' + brl(v) + ' de ' + p.nome + ' (vencimento ' + dataLonga(p.venceEm) + ')?')) return;
  const agora = Date.now(), novo = p.recorrente !== false ? addMes(p.venceEm, p.diaVenc) : null;
  try {
    await db.collection('lancamentos').add({ tipo: 'mensalidade', profId: id, profNome: p.nome, valor: v, mes: mesAtual(), pago: true, pagoEm: agora, obs: 'ref. venc. ' + dataBr(p.venceEm), ts: agora });
    await db.collection('profissionais').doc(id).set({ venceEm: novo, ultimoPagamento: agora }, { merge: true });
    toast(novo ? 'Pago! Próximo vencimento ' + dataLonga(novo) : 'Pago!');
  } catch (e) { alert('Erro: ' + e.message); }
}
function cobrarVenc(id) {
  const p = profs.find(x => x.id === id); if (!p) return;
  abrirWa(p.tel, fill(cfgv('msgCobranca'), { profissional: p.nome, valor: brl(p.valorCobranca), vencimento: dataLonga(p.venceEm) }));
}

/* ---------- Configurações ---------- */
function tabConf() {
  const sec = S.confSec, gr = sec === 'prof' ? 'prof' : 'class';
  const nIt = cid => (gr === 'prof' ? profs : ads).filter(p => p.catId === cid).length;
  const linhaCat = c => `<div class="it"><div class="inf"><b>${esc(c.nome)}</b><small>${nIt(c.id)} cadastrado(s)${gr === 'prof' && c.pct != null && c.pct !== '' ? ' • padrão ' + c.pct + '%' : ''}${gr === 'prof' && c.mensal ? ' • mensal ' + brl(c.mensal) : ''}</small></div>
      <div class="ac"><button class="btn gray sm" onclick="formCat('${c.id}','${sec}')">Editar</button><button class="btn red sm" onclick="delCat('${c.id}')">Excluir</button></div></div>`;
  const gs = grupos.filter(g => g.sec === sec);
  const caixa = (g, i) => `<div class="gbox"><div class="gh"><b>${esc(g.icone || '📁')} ${esc(g.nome)}</b><div class="ac">
      <button class="btn gray sm" ${i === 0 ? 'disabled' : ''} onclick="moverGrupo('${g.id}',-1)">↑</button><button class="btn gray sm" ${i === gs.length - 1 ? 'disabled' : ''} onclick="moverGrupo('${g.id}',1)">↓</button>
      <button class="btn gray sm" onclick="formGrupo('${g.id}','${sec}')">Editar</button><button class="btn red sm" onclick="delGrupo('${g.id}')">Excluir</button></div></div>
      ${catsDoGrupo(sec, g.id).map(linhaCat).join('') || '<p class="hint">Nenhuma categoria neste grupo ainda.</p>'}
      <button class="btn out sm" style="margin-top:8px" onclick="formCat('','${sec}','${g.id}')">+ Nova categoria aqui</button></div>`;
  const soltas = catsDoGrupo(sec, '_outros');
  const abas = [['prof', '👷 Profissionais'], ['class', '🏷️ Classificados'], ['emp', '💼 Empregos']];
  const blocoCats = `<div class="box"><h3>Grupos e categorias</h3>
    <div class="sub-seg">${abas.map(a => `<button class="${sec === a[0] ? 'on' : ''}" onclick="S.confSec='${a[0]}';render()">${a[1]}</button>`).join('')}</div>
    <p class="hint">O cliente vê primeiro os <b>grupos</b> (ex: Veículos). Ao tocar, vê as <b>categorias</b> (ex: Carros, Motos). Você cria os grupos e as categorias do jeito que quiser.</p>
    ${gs.map(caixa).join('')}
    ${soltas.length ? `<div class="gbox"><div class="gh"><b>📦 Sem grupo</b></div><p class="hint">Aparecem para o cliente dentro de "Outros". Toque em Editar para colocar num grupo.</p>${soltas.map(linhaCat).join('')}</div>` : ''}
    ${!gs.length && !soltas.length ? '<p class="hint" style="margin-top:12px">Nada criado ainda. Crie um grupo, ou use o botão de sugeridos para começar com uma lista pronta.</p>' : ''}
    <div class="row" style="margin-top:12px"><button class="btn sm" onclick="formGrupo('','${sec}')">+ Novo grupo</button><button class="btn out sm" onclick="criarSugeridas('${sec}')">Criar grupos e categorias sugeridos</button></div></div>`;
  return blocoCats + `<div class="box"><h3>Cobrança padrão</h3>
    <label style="margin-top:0">Valor a cobrar ao iniciar a cobrança (R$)</label><input id="cfTaxa" inputmode="decimal" value="${cfgv('taxaEntrada')}">
    <div class="two"><div><label>Porcentagem padrão (%)</label><input id="cfPct" inputmode="decimal" value="${cfg.pct != null ? cfg.pct : ''}" placeholder="Ex: 1"></div>
    <div><label>Mensalidade padrão (R$)</label><input id="cfMensal" inputmode="decimal" value="${cfg.mensal != null ? cfg.mensal : ''}" placeholder="Opcional"></div></div>
    <label>Prazo para pagar depois de iniciar a cobrança (dias)</label><input id="cfPrazo" inputmode="numeric" value="${cfgv('prazoDias')}">
    <p class="hint">Quem entra fica em teste grátis até você iniciar a cobrança dele. O valor acima é usado se o profissional não tiver mensalidade própria, e você pode mudá-lo na hora de iniciar. Tudo vale para todo mundo e pode ser mudado por categoria ou por profissional.</p></div>
    <div class="box"><h3>Mensagens prontas</h3>
    <label style="margin-top:0">Perguntar ao cliente como foi</label><textarea id="cfMsgC">${esc(cfgv('msgCliente'))}</textarea>
    <label>Perguntar ao profissional se fechou</label><textarea id="cfMsgP">${esc(cfgv('msgProf'))}</textarea>
    <label>Relatório mensal para o profissional</label><textarea id="cfMsgR">${esc(cfgv('msgRelatorio'))}</textarea>
    <label>Cobrança do profissional (vencimento)</label><textarea id="cfMsgV">${esc(cfgv('msgCobranca'))}</textarea>
    <p class="hint">O app troca sozinho: {cliente} {profissional} {contatos} {mes} {valor} {vencimento}</p>
    <button class="btn full" style="margin-top:12px" onclick="salvarCfg()">Salvar configurações</button></div>
    <div class="box"><h3>Atualizar o app (versão ${VERSAO})</h3>
    <p class="hint" style="font-size:13.5px">Tudo que dá para mudar aqui no painel (profissionais, categorias, preços, mensagens, cobrança) muda na hora, sem mexer no GitHub. Só quando você receber um arquivo novo:</p>
    <ol style="font-size:13.5px;line-height:1.6;margin:8px 0 10px 20px"><li>Apague os arquivos "index" antigos da pasta Downloads do celular.</li><li>Baixe o arquivo novo (ele vai se chamar index.html).</li><li>Toque no botão abaixo, escolha o arquivo e toque em Confirmar alterações.</li></ol>
    <a class="btn full" style="display:block;text-align:center;text-decoration:none" href="https://github.com/jjunimsalao-jpg/umamaozinha/upload/main" target="_blank" rel="noopener">Abrir a página de envio do GitHub</a></div>`;
}
async function salvarCfg() {
  const d = { taxaEntrada: num($('cfTaxa').value) || 0, pct: num($('cfPct').value), mensal: num($('cfMensal').value), msgCliente: $('cfMsgC').value.trim(), msgProf: $('cfMsgP').value.trim(), msgRelatorio: $('cfMsgR').value.trim(), msgCobranca: $('cfMsgV').value.trim(), prazoDias: parseInt($('cfPrazo').value, 10) || 30 };
  try { await db.collection('config').doc('geral').set(d, { merge: true }); toast('Configurações salvas'); } catch (e) { alert('Erro: ' + e.message); }
}
function formCat(id, sec, gidPre) {
  const c = id ? cats.find(x => x.id === id) : {}, gr = sec === 'prof' ? 'prof' : 'class';
  const gs = grupos.filter(g => g.sec === sec), atual = gidPre || c.grupoId || '';
  abrirModal(`<button class="x" onclick="fechar()">×</button><h2>${id ? 'Editar' : 'Nova'} categoria</h2>
    <label>Nome da categoria</label><input id="cn" value="${esc(c.nome || '')}" placeholder="Ex: ${gr === 'prof' ? 'Pedreiro' : (sec === 'emp' ? 'Vagas de padeiro' : 'Carros')}">
    <label>Grupo</label><select id="cg"><option value="">Sem grupo (aparece em "Outros")</option>${gs.map(g => `<option value="${g.id}" ${g.id === atual ? 'selected' : ''}>${esc((g.icone || '') + ' ' + g.nome)}</option>`).join('')}</select>
    ${gr === 'prof' ? `<div class="two"><div><label>% padrão</label><input id="cp" inputmode="decimal" value="${c.pct != null ? c.pct : ''}" placeholder="Ex: 3"></div>
    <div><label>Mensalidade padrão (R$)</label><input id="cm" inputmode="decimal" value="${c.mensal != null ? c.mensal : ''}" placeholder="Ex: 50"></div></div>
    <p class="hint">Opcional. Vale para quem não tiver valor próprio.</p>` : ''}
    <button class="btn full" style="margin-top:16px" onclick="salvarCat('${id || ''}','${sec}')">Salvar</button>`);
}
async function salvarCat(id, sec) {
  const nome = $('cn').value.trim(); if (!nome) return alert('Digite o nome da categoria.');
  const gr = sec === 'prof' ? 'prof' : 'class';
  const d = { nome, grupo: gr, grupoId: $('cg').value || null };
  if (gr === 'prof') { d.pct = num($('cp').value); d.mensal = num($('cm').value); }
  try { id ? await db.collection('categorias').doc(id).set(d, { merge: true }) : await db.collection('categorias').add(d); fechar(); toast('Categoria salva'); } catch (e) { alert('Erro ao salvar: ' + e.message); }
}
async function delCat(id) {
  if (profs.some(p => p.catId === id) || ads.some(a => a.catId === id)) return alert('Essa categoria tem itens cadastrados. Mova ou exclua eles primeiro.');
  if (confirm('Excluir esta categoria?')) await db.collection('categorias').doc(id).delete();
}
function formGrupo(id, sec) {
  const g = id ? grupos.find(x => x.id === id) : {};
  abrirModal(`<button class="x" onclick="fechar()">×</button><h2>${id ? 'Editar' : 'Novo'} grupo</h2>
    <label>Nome do grupo</label><input id="gn" value="${esc(g.nome || '')}" placeholder="Ex: ${sec === 'prof' ? 'Alimentação' : (sec === 'emp' ? 'Empregos' : 'Veículos')}">
    <label>Ícone (um emoji)</label><input id="gi" value="${esc(g.icone || '')}" placeholder="Toque num emoji abaixo">
    <div class="emo">${EMOJIS.map(e => `<span onclick="$('gi').value='${e}'">${e}</span>`).join('')}</div>
    <p class="hint">O ícone aparece no botão grande que o cliente vê. Se deixar vazio, aparece uma pasta.</p>
    <button class="btn full" style="margin-top:16px" onclick="salvarGrupo('${id || ''}','${sec}')">Salvar</button>`);
}
async function salvarGrupo(id, sec) {
  const nome = $('gn').value.trim(); if (!nome) return alert('Digite o nome do grupo.');
  const d = { isGrupo: true, sec, nome, icone: $('gi').value.trim() };
  if (!id) d.ordem = Date.now();
  try { id ? await db.collection('categorias').doc(id).set(d, { merge: true }) : await db.collection('categorias').add(d); fechar(); toast('Grupo salvo'); } catch (e) { alert('Erro ao salvar: ' + e.message); }
}
async function delGrupo(id) {
  if (cats.some(c => c.grupoId === id)) return alert('Esse grupo ainda tem categorias. Mova ou exclua elas primeiro.');
  if (confirm('Excluir este grupo?')) await db.collection('categorias').doc(id).delete();
}
async function moverGrupo(id, dir) {
  const g = grupos.find(x => x.id === id); if (!g) return;
  const L = grupos.filter(x => x.sec === g.sec), i = L.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= L.length) return;
  const t = L[i]; L[i] = L[j]; L[j] = t;
  const b = db.batch(); L.forEach((x, k) => b.update(db.collection('categorias').doc(x.id), { ordem: k }));
  try { await b.commit(); } catch (e) { alert('Erro: ' + e.message); }
}
async function criarSugeridas(sec) {
  if (!confirm('Vou criar os grupos e as categorias de exemplo. O que você já tem não é repetido, e dá para editar ou apagar depois. Continuar?')) return;
  const gr = sec === 'prof' ? 'prof' : 'class', col = db.collection('categorias'), b = db.batch();
  let nG = 0, nC = 0, ord = grupos.filter(g => g.sec === sec).length;
  for (const [icone, nome, lista] of SUG[sec]) {
    const ex = grupos.find(x => x.sec === sec && norm(x.nome) === norm(nome));
    let gid;
    if (ex) gid = ex.id; else { const ref = col.doc(); gid = ref.id; b.set(ref, { isGrupo: true, sec, nome, icone, ordem: ord++ }); nG++; }
    for (const cn of lista) {
      const c = cats.find(x => grupo(x) === gr && norm(x.nome) === norm(cn));
      if (c) { if (!grupoDe(c)) { b.update(col.doc(c.id), { grupoId: gid }); nC++; } }
      else { b.set(col.doc(), { nome: cn, grupo: gr, grupoId: gid }); nC++; }
    }
  }
  if (!nG && !nC) return toast('Tudo isso já existe');
  try { await b.commit(); toast(nG + ' grupo(s) e ' + nC + ' categoria(s) organizados'); } catch (e) { alert('Erro: ' + e.message); }
}
</script>
</body>
